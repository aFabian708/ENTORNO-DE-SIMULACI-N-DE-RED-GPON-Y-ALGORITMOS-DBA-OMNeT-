[General]
network         = GponNetwork
sim-time-limit  = 60s
warmup-period   = 2s
result-dir      = ../results
seed-set        = 0
**.totalOnus    = 64
**.tickInterval = 0.002s
**.onu[*].demandFile    = "../simulations/dataset_demanda_2ms.csv"
**.onu[*].factoresFile  = "../simulations/factores_onu.txt"
**.olt.factoresFile     = "../simulations/factores_onu.txt"
**.onu[*].demandScaleFactor = 1.0
**.olt.demandScaleFactor    = 1.0
**.olt.margenConservadorBytes = 0

[Config react_cap50k]
**.olt.dbaScheme = "reactive_delayed"
**.olt.assignableBytes = 50000

[Config react_cap60k]
**.olt.dbaScheme = "reactive_delayed"
**.olt.assignableBytes = 60000

[Config react_cap70k]
